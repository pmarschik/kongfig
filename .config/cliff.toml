# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration
#
# Only overrides that differ from the built-in defaults are listed here.
# Release highlights: use annotated tag messages (git tag -m "highlights").

[changelog]
body = """
{% if version %}\
    ## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## Unreleased
{% endif %}\
{% if message %}

{{ message }}
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}

### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | upper_first }}
{%- endfor %}
{% endfor %}
"""

footer = """
{% for release in releases -%}
    {% if release.version -%}
[{{ release.version }}]: https://github.com/pmarschik/kongfig/releases/tag/{{ release.version }}
    {% endif -%}
{% endfor %}
"""

[git]
# Only the root module's tags are releases. The submodule tags
# (kong/vX.Y.Z, parsers/toml/vX.Y.Z, …) sit on the same commit and would
# otherwise be picked as "the latest tag": --bumped-version then answers
# with a name like `style/charming/v0.5.0`, because it sorts after
# `v0.5.0`, and the release tasks pin every go.mod to it.
tag_pattern = "^v[0-9]"

commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->🚀 Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^doc", group = "<!-- 3 -->📚 Documentation" },
  { message = "^perf", group = "<!-- 4 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 2 -->🚜 Refactor" },
  { message = "^style", group = "<!-- 5 -->🎨 Styling" },
  { message = "^test", group = "<!-- 6 -->🧪 Testing" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(pull\\)", skip = true },
  { message = "^chore|^ci", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },
  { body = ".*security", group = "<!-- 8 -->🛡️ Security" },
  { message = "^revert", group = "<!-- 9 -->◀️ Revert" },
  { message = ".*", group = "<!-- 10 -->💼 Other" },
]
