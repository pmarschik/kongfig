name: release

on:
  push:
    tags:
      - "v[0-9]*"
  # Recovery path for a release whose tag push never produced an event: GitHub
  # creates none when more than three tags arrive at once, and this repo writes
  # one tag per workspace module onto a single commit.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v0.6.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --config .config/goreleaser.yaml --release-notes CHANGELOG.md --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Every module tag sits on the release commit, so `git describe` cannot
          # name the version. Hand goreleaser the tag instead of letting it guess.
          GORELEASER_CURRENT_TAG: ${{ github.event.inputs.tag || github.ref_name }}
