# :schema https://mise.jdx.dev/schema/mise.json
# SCAFFOLD: Merge common tools from assets/common/mise.toml into [tools]
[tools]
hk = "latest"
git-cliff = "latest"
typos = "latest"
go = "latest"
golangci-lint = "2"
goreleaser = "latest"
dprint = "latest"
gofumpt = "latest"
cocogitto = "latest"

[env]
HK_FILE = ".config/hk.pkl"
HK_MISE = "1"

# Tasks are file-based in .config/mise/tasks/
# See assets/go/tasks/ for the task scripts

# The shared Go tasks live with the other Go repos, so they live in
# devkit rather than here. Setting includes replaces the default discovery,
# which is why the local directory needs its own entry, and it goes last so a
# local file still wins on a name clash. An include mise cannot parse is
# skipped in silence — after a change here, check `mise tasks ls`.
[task_config]
includes = [
  "git::https://github.com/pmarschik/devkit.git//mise/go?ref=v1",
  ".config/mise/tasks",
]
